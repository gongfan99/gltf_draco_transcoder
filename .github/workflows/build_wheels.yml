name: Build and Release Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DRACO_VERSION: 1.5.7
  DRACO_SDK_REL_PATH: sdk

jobs:
  build-draco-sdk:
    name: build-draco-sdk-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            container: ubuntu:18.10
            cmake_generator: "Unix Makefiles"
            cmake_build_args: "-- -j2"
            sdk_target: draco_static
            lib_name: libdraco.a
            package_commands: |
              mkdir -p ../sdk/lib ../sdk/include
              cp _gh_sdk_build/libdraco.a ../sdk/lib/
              cp -r src/draco ../sdk/include/
              cp _gh_sdk_build/draco/draco_features.h ../sdk/include/draco/
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
            cmake_build_args: "--config Release"
            sdk_target: draco
            lib_name: draco.lib
            package_commands: |
              mkdir -p ../sdk/lib ../sdk/include
              cp _gh_sdk_build/Release/draco.lib ../sdk/lib/
              cp -r src/draco ../sdk/include/
              cp _gh_sdk_build/draco/draco_features.h ../sdk/include/draco/
          - os: macos-latest
            cmake_generator: "Unix Makefiles"
            cmake_build_args: "-- -j2"
            sdk_target: draco_static
            lib_name: libdraco.a
            package_commands: |
              mkdir -p ../sdk/lib ../sdk/include
              cp _gh_sdk_build/libdraco.a ../sdk/lib/
              cp -r src/draco ../sdk/include/
              cp _gh_sdk_build/draco/draco_features.h ../sdk/include/draco/
    container: ${{ matrix.container }}
    steps:
      - name: Cache Draco SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.DRACO_SDK_REL_PATH }}
          key: draco-sdk-${{ matrix.os }}-${{ env.DRACO_VERSION }}
          restore-keys: |
            draco-sdk-${{ matrix.os }}-${{ env.DRACO_VERSION }}

      - name: Install git (Ubuntu 18.10)
        if: matrix.os == 'ubuntu-latest' && steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          sed -i 's/archive.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          sed -i 's/security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          apt-get update && apt-get install -y git

      - name: Clone Draco with Submodules
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: google/draco
          path: draco-src
          ref: ${{ env.DRACO_VERSION }}
          submodules: true

      - name: Configure CMake for Draco SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: draco-src
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            apt-get update && apt-get install -y build-essential cmake
          fi
          mkdir _gh_sdk_build && cd _gh_sdk_build
          cmake .. -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDRACO_TRANSCODER_SUPPORTED=ON \
            -DDRACO_BUILD_EXECUTABLES=OFF \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build Draco SDK (static library)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: draco-src/_gh_sdk_build
        run: cmake --build . --target ${{ matrix.sdk_target }} ${{ matrix.cmake_build_args }}

      - name: Create SDK package
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: draco-src
        shell: bash
        run: ${{ matrix.package_commands }}

      - name: Upload SDK as artifact (fallback)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: draco-sdk-${{ matrix.os }}
          path: ${{ env.DRACO_SDK_REL_PATH }}
          retention-days: 7

  checkout-source:
    name: checkout-source
    runs-on: ubuntu-latest
    needs: [build-draco-sdk]
    if: |
      always() &&
      (needs.build-draco-sdk.result == 'success' || needs.build-draco-sdk.result == 'skipped')
    steps:
      - name: Clone This Repo
        uses: actions/checkout@v4
        with:
          path: .

      - name: Upload source code
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: .
          retention-days: 1

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [checkout-source]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    steps:
      - name: Cache Draco SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.DRACO_SDK_REL_PATH }}
          key: draco-sdk-${{ matrix.os }}-${{ env.DRACO_VERSION }}
          restore-keys: |
            draco-sdk-${{ matrix.os }}-${{ env.DRACO_VERSION }}

      - name: Download Draco SDK (if not cached)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: draco-sdk-${{ matrix.os }}
          path: ${{ env.DRACO_SDK_REL_PATH }}

      - name: Download source code
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: .

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          DRACO_SDK_PATH: ${{ github.workspace }}/${{ env.DRACO_SDK_REL_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [build_wheels]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-ubuntu-latest
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-windows-latest
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-macos-latest
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cibw-sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
