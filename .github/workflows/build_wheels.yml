name: Build and Release Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DRACO_VERSION: main
  DRACO_SDK_REL_PATH: draco_sdk

jobs:
  build-draco-sdk:
    name: build-draco-sdk-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          #   container: quay.io/pypa/manylinux_2_28_x86_64
          #   cmake_generator: "Unix Makefiles"
          #   cmake_build_args: "-- -j2"
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            cmake_generator: "Unix Makefiles"
            cmake_build_args: "-- -j4"
          # - os: windows-latest
          #   cmake_generator: "Visual Studio 17 2022"
          #   cmake_build_args: "--config Release"
          - os: macos-latest
            cmake_generator: "Unix Makefiles"
            cmake_build_args: "-- -j2"
    container: ${{ matrix.container }}
    steps:
      - name: Cache Draco SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.DRACO_SDK_REL_PATH }}
          key: draco-sdk-${{ matrix.os }}-${{ env.DRACO_VERSION }}
          restore-keys: |
            draco-sdk-${{ matrix.os }}-${{ env.DRACO_VERSION }}

      - name: Clone Draco with Submodules
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: google/draco
          path: draco_src
          ref: ${{ env.DRACO_VERSION }}
          submodules: true

      - name: Configure CMake for Draco SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: draco_src
        shell: bash
        run: |
          mkdir _gh_draco_sdk_build && cd _gh_draco_sdk_build
          cmake .. -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DDRACO_TRANSCODER_SUPPORTED=ON \
            -DDRACO_BUILD_EXECUTABLES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=../../${{ env.DRACO_SDK_REL_PATH }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build Draco SDK (static library)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: draco_src/_gh_draco_sdk_build
        run: cmake --build . ${{ matrix.cmake_build_args }}

      - name: Create SDK package
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: draco_src
        shell: bash
        run: |
          cmake --install _gh_draco_sdk_build
          mkdir -p ../../${{ env.DRACO_SDK_REL_PATH }}/include/
          cp -r third_party/eigen/Eigen ../../${{ env.DRACO_SDK_REL_PATH }}/include/
          cp -r third_party/filesystem/include/ghc ../../${{ env.DRACO_SDK_REL_PATH }}/include/
          cp third_party/tinygltf/*.h third_party/tinygltf/*.hpp ../../${{ env.DRACO_SDK_REL_PATH }}/include/ 2>/dev/null || true

      - name: Upload SDK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: draco-sdk-${{ matrix.os }}
          path: ${{ env.DRACO_SDK_REL_PATH }}
          retention-days: 1

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build-draco-sdk]
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          # - os: windows-latest
          - os: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Draco SDK
        uses: actions/download-artifact@v4
        with:
          name: draco-sdk-${{ matrix.os }}
          path: ${{ env.DRACO_SDK_REL_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          DRACO_SDK_PATH: ${{ github.workspace }}/${{ env.DRACO_SDK_REL_PATH }}
          CIBW_ARCHS_MACOS: arm64
          CIBW_ENVIRONMENT_LINUX: DRACO_SDK_PATH=/project/${{ env.DRACO_SDK_REL_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  test_wheels:
    name: Test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build_wheels]
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          # - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install wheel and test
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install dist/*.whl
          pytest tests/

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [test_wheels]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    needs: [build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-ubuntu-latest
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-ubuntu-24.04-arm
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-windows-latest
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-macos-latest
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: cibw-sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
